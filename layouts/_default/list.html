{{ define "main" }}
<div class="content-section">
  <div class="section-title">{{ .Title }}</div>
  <p style="color:#cbd5e1; margin-bottom:25px;">{{ .Description }}</p>

  <div class="article-grid">
    {{ range .Paginator.Pages }}
    <div class="article-card">
      <div>
        <h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3>
        <p>{{ .Summary | truncate 110 }}</p>
      </div>
      <div class="article-meta" style="display:flex; justify-content:space-between; align-items:center;">
        <span>📅 {{ .Date.Format "2006-01-02" }}</span>
        <a href="{{ .RelPermalink }}" class="cta-btn" style="padding:4px 12px; font-size:0.82rem; text-decoration:none;">👉 阅读全文</a>
      </div>
    </div>
    {{ end }}
  </div>

  <div style="margin-top:30px; text-align:center;">
    {{ template "_internal/pagination.html" . }}
  </div>
</div>
{{ end }}
